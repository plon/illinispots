name: Tableau daily events

on:
  schedule:
    - cron: "5 0 * * *"
      timezone: "America/Chicago"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduling-data-writes
  cancel-in-progress: false

jobs:
  update-daily-events:
    name: Update daily events
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: data-pipeline

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      APP_ENV: production
      PYTHONPATH: .
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: data-pipeline/requirements.txt

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Start Sentry monitor
        id: sentry-monitor
        continue-on-error: true
        # 415 minutes after 12:05 AM is the 7:00 AM Central freshness deadline.
        run: >-
          python sentry_monitor.py start
          --monitor-slug tableau-daily-events
          --schedule "5 0 * * *"
          --timezone "America/Chicago"
          --checkin-margin 415
          --max-runtime 15

      - name: Update Tableau daily events
        run: >-
          python sentry_monitor.py run-stage
          --monitor-slug tableau-daily-events
          --stage update-daily-events
          --label "Update Tableau daily events"
          -- python cron/tableau_dailyevents_scraper.py

      - name: Complete Sentry monitor
        if: ${{ always() }}
        continue-on-error: true
        run: >-
          python sentry_monitor.py finish
          --monitor-slug tableau-daily-events
          --check-in-id "${{ steps.sentry-monitor.outputs.check_in_id }}"
          --status "${{ job.status == 'success' && 'ok' || 'error' }}"
