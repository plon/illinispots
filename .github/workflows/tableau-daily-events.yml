name: Tableau daily events

on:
  schedule:
    # 5:17 AM CST / 6:17 AM CDT. The offset changes because GitHub cron uses UTC.
    - cron: "17 11 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tableau-daily-events
  cancel-in-progress: false

jobs:
  update-daily-events:
    name: Update daily events
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: data-pipeline

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      PYTHONPATH: .

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: data-pipeline/requirements.txt

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Update Tableau daily events
        run: python cron/tableau_dailyevents_scraper.py
