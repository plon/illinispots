name: Course Explorer weekly update

on:
  schedule:
    # Saturday at 3:17 AM CST / 4:17 AM CDT. GitHub cron uses UTC.
    - cron: "17 9 * * 6"
  workflow_dispatch:
    inputs:
      year:
        description: "Course Explorer year (leave blank to use the active term)"
        required: false
        type: string
      term:
        description: "Course Explorer term (auto uses the active term)"
        required: false
        default: auto
        type: choice
        options:
          - auto
          - spring
          - summer
          - fall
          - winter

permissions:
  contents: read

concurrency:
  group: scheduling-data-writes
  cancel-in-progress: false

jobs:
  update-course-data:
    name: Update course data
    runs-on: ubuntu-latest
    timeout-minutes: 180

    defaults:
      run:
        working-directory: data-pipeline

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      APP_ENV: production
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: data-pipeline/requirements.txt

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Start Sentry monitor
        id: sentry-monitor
        continue-on-error: true
        run: >-
          python sentry_monitor.py start
          --monitor-slug course-explorer-weekly
          --schedule "17 9 * * 6"
          --checkin-margin 60
          --max-runtime 180

      - name: Scrape Course Explorer
        env:
          COURSE_YEAR: ${{ inputs.year }}
          COURSE_TERM: ${{ inputs.term }}
        run: |
          args=(
            --fresh
            --no-skip-errors
            --proxy-retries 5
            --request-delay 0.5
            --timeout 45
          )

          if [[ -n "$COURSE_YEAR" ]]; then
            args+=(--year "$COURSE_YEAR")
          fi

          if [[ -n "$COURSE_TERM" && "$COURSE_TERM" != "auto" ]]; then
            args+=(--term "$COURSE_TERM")
          fi

          python sentry_monitor.py run-stage \
            --monitor-slug course-explorer-weekly \
            --stage scrape-course-explorer \
            --label "Scrape Course Explorer" \
            -- python one_shot_scraper.py "${args[@]}"

      - name: Transform subjects into buildings
        run: >-
          python sentry_monitor.py run-stage
          --monitor-slug course-explorer-weekly
          --stage transform-subjects
          --label "Transform subjects into buildings"
          -- python subject_to_buildings.py

      - name: Filter buildings
        run: >-
          python sentry_monitor.py run-stage
          --monitor-slug course-explorer-weekly
          --stage filter-buildings
          --label "Filter buildings"
          -- python filter_buildings.py

      - name: Add building hours
        run: >-
          python sentry_monitor.py run-stage
          --monitor-slug course-explorer-weekly
          --stage add-building-hours
          --label "Add building hours"
          -- python add_building_hours.py

      - name: Add building coordinates
        run: >-
          python sentry_monitor.py run-stage
          --monitor-slug course-explorer-weekly
          --stage add-building-coordinates
          --label "Add building coordinates"
          -- python add_building_coordinates.py

      - name: Audit building metadata
        run: >-
          python sentry_monitor.py run-stage
          --monitor-slug course-explorer-weekly
          --stage audit-building-metadata
          --label "Audit building metadata"
          -- python audit_building_metadata.py

      - name: Load course data into Supabase
        run: >-
          python sentry_monitor.py run-stage
          --monitor-slug course-explorer-weekly
          --stage load-course-data
          --label "Load course data into Supabase"
          -- python load_to_postgres.py

      - name: Complete Sentry monitor
        if: ${{ always() }}
        continue-on-error: true
        run: >-
          python sentry_monitor.py finish
          --monitor-slug course-explorer-weekly
          --check-in-id "${{ steps.sentry-monitor.outputs.check_in_id }}"
          --status "${{ job.status == 'success' && 'ok' || 'error' }}"
