<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no"
    />
    <meta name="robots" content="index, follow" />
    <meta
      name="description"
      content="Find available UIUC study spaces and empty classrooms in real-time. Interactive campus map showing open rooms at the University of Illinois Urbana-Champaign."
    />
    <meta
      name="google-site-verification"
      content="VDVWq1BdAlOLD14tNM033IajP3Z_GVrXo2P23Rg3gAA"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="illiniSpots" />
    <meta name="theme-color" content="#13294b" />
    <script>
      (function() {
        try {
          var stored = localStorage.getItem("theme");
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var isDark = stored === "dark" || ((!stored || stored === "system") && prefersDark);
          if (isDark) {
            document.documentElement.classList.add("dark");
            document.documentElement.style.colorScheme = "dark";
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute("content", "#09090b");
          } else {
            document.documentElement.classList.remove("dark");
            document.documentElement.style.colorScheme = "light";
          }
        } catch (e) {}
      })();
    </script>
    <link rel="canonical" href="https://illinispots.com/" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icon-16.png" sizes="16x16" type="image/png" />
    <link rel="icon" href="/icon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/icon-192.png" sizes="192x192" type="image/png" />
    <link rel="icon" href="/icon-512.png" sizes="512x512" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>illiniSpots - Real-Time UIUC Study Spots & Empty Classroom Finder</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
